<footer class="closing-section">
  <span class="closing-ornament" aria-hidden="true">❋</span>

  <p class="closing-message" appScrollReveal>{{ invitation.closingMessage }}</p>

  <p class="closing-signoff" appScrollReveal [revealDelay]="150">With love &amp; duas,</p>

  <p class="closing-names" appScrollReveal [revealDelay]="250">
    {{ invitation.groom }} &amp; {{ invitation.bride }}
  </p>
</footer>
